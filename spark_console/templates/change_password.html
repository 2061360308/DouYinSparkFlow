{% extends "base.html" %}{% block content %}
<section class="auth-card"><div class="eyebrow">首次登录保护</div><h1>设置你自己的密码</h1><p class="muted">临时密码只能使用一次，新密码至少 12 位。</p>
<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>当前临时密码<input type="password" name="current_password" required></label><label>新密码<input type="password" name="new_password" minlength="12" required></label><button>保存并进入控制台</button></form></section>
{% endblock %}
