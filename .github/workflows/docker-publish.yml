name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "调试模式：只构建，不推送到 GHCR（不产生任何 tag）"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      # 构建上下文本身（Dockerfile 内容 / 忽略规则）
      - Dockerfile
      - .dockerignore
      # 构建期会 COPY 进镜像的内容 —— 镜像是 `COPY . /app` 全量打进，
      # 改了就必须重建，否则推上去的还是旧代码。此清单需与 detect-changes 的 PATTERNS 保持一致
      - main.py
      - fc_server.py
      - core/**
      - utils/**
      - VERSION
      - requirements.txt
      # 容器入口与编排
      - docker/**
      - docker-compose.yml
      # 本工作流自身
      - .github/workflows/docker-publish.yml

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/douyinsparkflow
  VERSION_FILE: VERSION
  CONTEXT_DIR: .

jobs:
  # ── 0. 变更判定：决定 publish 要不要跑 ─────────────────────────────────
  # 为什么不交给 on.push.paths 一家说了算：workflow_dispatch 手动触发时 paths 不生效，
  # 需要一个 forced 兜底；把「本次要不要重建」在这里算一次，publish 只读结果。
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      forced: ${{ steps.classify.outputs.forced }}
      needs_build: ${{ steps.classify.outputs.needs_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 要按 before..sha 做 diff，必须拿到 before 那个提交

      - name: 判定镜像是否需要重建
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 手动触发 = 强制重建（dispatch 不受 paths 过滤影响，语义就是「我现在就要它跑」）
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "forced=true" >> "$GITHUB_OUTPUT"
          else
            echo "forced=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          else
            # before 拿不到（首次推送 / 新分支 / force push）：保守起见按「全都要」算
            CHANGED="$(git ls-files)"
          fi
          echo "本次改动文件："
          echo "$CHANGED"

          # 改到这些就得重建镜像（与 on.push.paths 那份清单保持一致）
          PATTERNS='^(Dockerfile|\.dockerignore|main\.py|fc_server\.py|VERSION|requirements\.txt|docker-compose\.yml|\.github/workflows/docker-publish\.yml)$|^(core|utils|docker)/'

          if printf '%s\n' "$CHANGED" | grep -Eq "$PATTERNS"; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. 构建一次，推送到 GHCR ───────────────────────────────────────────
  # 只推 GHCR：走 GitHub 自己的网络，最稳最快。ACR 那边由阿里云自己的构建规则
  # （海外机器构建）产出，本流水线不再碰 ACR，避免两个写入方互相覆盖 latest。
  # 三个 tag（latest / 分支名 / sha-xxx）合并成一次 output —— buildx 的 name 是
  # --output 里的 CSV 字段，多 tag 必须对完整 name 字段加引号，否则逗号会被解析成
  # KV 分隔符，命令直接报错。
  publish:
    name: Build → GHCR
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.forced == 'true' || needs.detect-changes.outputs.needs_build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 初始化 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算 GHCR 镜像 tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: 读取镜像版本号
        id: version
        run: echo "value=$(cat "$VERSION_FILE")" >> "$GITHUB_OUTPUT"

      - name: 构建一次并推送到 GHCR
        env:
          GHCR_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          cd "$CONTEXT_DIR"

          if [ "${DRY_RUN:-false}" = "true" ]; then
            # 调试模式：只构建，不产出任何镜像，绝不碰 registry
            echo "==> 调试模式: 只构建，不推送"
            OUTPUT='type=cacheonly'
          else
            # metadata-action 输出是换行分隔的多行 tag → 合并成 CSV 列表
            TAGS="$(printf '%s\n' "$GHCR_TAGS" | sed '/^$/d' | paste -sd, -)"
            echo "==> GHCR 推送目标: ${TAGS}"
            # buildx 的 name 是 --output 里的 CSV 字段，多 tag 必须对完整 name 加引号，
            # 否则逗号会被解析成 KV 分隔符直接报错
            OUTPUT="type=image,\"name=${TAGS}\",push=true,oci-mediatypes=false"
          fi

          # --provenance=false --sbom=false: 禁止 buildx 默认附加的 SLSA attestation
          #   （会生成 unknown/unknown 平台的 OCI index，曾导致 latest 异常）
          # --output ...,oci-mediatypes=false: 强制导出 docker schema2 manifest，
          #   而非 buildx 默认的 OCI。schema2 通用兼容性最好，各类第三方拉取工具都认。
          # --cache-to mode=min: 只缓存最终镜像的层。max 会把所有中间层塞进 GHA cache，
          #   而本镜像含 ~230MB 字体 + ~200MB Chromium，10GB 配额很容易被撑爆驱逐，
          #   反而导致下次全量重建。
          docker buildx build --provenance=false --sbom=false \
            -f Dockerfile \
            --build-arg IMAGE_VERSION="$IMAGE_VERSION" \
            --cache-from type=gha \
            --cache-to type=gha,mode=min \
            --metadata-file /tmp/build-meta.json \
            --output "$OUTPUT" \
            .

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "==> 调试模式结束: 未推送任何镜像"
          else
            DIGEST="$(jq -r '."containerimage.digest"' /tmp/build-meta.json)"
            echo "==> GHCR 已推送: ${GHCR_IMAGE}@${DIGEST}"
          fi
