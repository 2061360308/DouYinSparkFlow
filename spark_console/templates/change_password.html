{% extends "base.html" %}{% block content %}
<div class="security-page">
<section class="auth-card security-card"><div class="security-mark" aria-hidden="true">✦</div><div class="eyebrow">{{ '首次登录保护' if user.must_change_password else 'ACCOUNT SECURITY' }}</div><h1>{{ '设置你自己的密码' if user.must_change_password else '修改密码' }}</h1><p class="muted">输入当前密码，新密码至少 12 位。</p>
{% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>当前密码<input type="password" name="current_password" autocomplete="current-password" required></label><label>新密码<input type="password" name="new_password" autocomplete="new-password" minlength="12" required></label><label>确认新密码<input type="password" name="new_password_confirmation" autocomplete="new-password" minlength="12" required></label><button>{{ '保存并进入控制台' if user.must_change_password else '保存新密码' }}</button></form></section>
</div>
{% endblock %}
