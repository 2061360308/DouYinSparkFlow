name: Build app (Windows + Linux deb)

# 把本地可视化工具（app）打包成桌面发行物并发布到 Release：
#   - Windows x64：PyInstaller onedir → DouyinSparkFlow-win-x64.zip
#   - Linux amd64 / arm64：PyInstaller onedir → tools/packaging/linux/build-deb.sh 打成 .deb
#
# Windows 发布包解开后的结构（exe 与两个"本地分发物"同级 —— app/paths.py 正是按
# 「程序目录 / resource_dir」去找它们的，所以用户解压即用）：
#
#   DouyinSparkFlow/
#     DouyinSparkFlow.exe                ← PyInstaller onedir 产物
#     _internal/...                      ← PyInstaller 运行时
#     cloakbrowser-windows-x64/          ← 自带隐身 Chromium（构建时从上游 release 拉）
#     gost/gost.exe                      ← 配套代理客户端（同理）
#
# 这两个目录都超过 GitHub 单文件 / 仓库合理体积，所以不入库，构建时现拉。
# 版本号：Windows 的 Chromium 走 env CLOAK_CHROMIUM_VERSION，gost 走 env GOST_VERSION；
# Linux 的 Chromium 走 matrix 里的 cloak_tag（x64 用 .5、arm64 用 .3，两版资产不同），
# gost 走 matrix 里的 gost_asset。升级时对应改一处即可。
#
# 前端（Vite singlefile）与平台无关，由 build-frontend 只构建一次，Windows / Linux
# 各矩阵 job 共用同一份 artifact，避免重复构建。
#
# 入口是仓库根的 main.py app 分支（app 是包，由 main.py 分派启动）。
# 发布版里工具数据（profiles/、profiles.json、local.json、.env）都在 exe 同级目录 ——
# 见 app/paths.py 的 project_root()：源码运行时 .env 落在仓库根，
# 打包后没有仓库可言，跟着 exe 走。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布用的 tag（留空则用 v<仓库 VERSION>）'
        required: false
        default: ''

permissions:
  contents: write

# 同一 tag 重复触发时取消旧运行，避免两个运行同时往同一个 Release 传文件
concurrency:
  group: build-app-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  # 与 Dockerfile 里的 CLOAK_CHROMIUM_VERSION 保持一致，别各改各的
  CLOAK_CHROMIUM_VERSION: 146.0.7680.177.5
  # 注意：gost v2.x 的 release **没有 Windows 资产**（只有 linux 包），必须用 v3。
  # 实测存在的版本：3.0.0 / 3.1.0 / 3.2.0 / 3.3.0；v3 的包是 zip，下面的解压逻辑通用。
  GOST_VERSION: 3.3.0
  # PyInstaller 产物名：exe 与目录同名
  APP_NAME: DouyinSparkFlow
  # cloakbrowser 若不在公开 PyPI，可在仓库 Secrets 里配 PIP_INDEX_URL / PIP_EXTRA_INDEX_URL
  # （pip 会自己读这两个环境变量，这里不用显式映射）

jobs:
  # 前端只构建一次，Windows / Linux 各矩阵 job 共用（Vite singlefile 产物与平台无关）
  build-frontend:
    name: Build frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建前端界面（Vite -> singlefile）
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: app/web/ui
      - run: npm run build
        working-directory: app/web/ui

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/web/dist
          if-no-files-found: error

  # 只做两件事：算发布 tag + 把 Release 建好一次。之后三个构建 job 并行，
  # 各自用 gh release upload 往这个已存在的 Release 传自己的文件 —— 纯资产上传，
  # 不会像 action-gh-release 那样并发建 release / updateRelease 打架。
  release-meta:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算发布 tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            # 手动触发且没给 tag：以仓库根 VERSION 为准
            tag="v$(cat VERSION)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 预建 Release（幂等，只建一次）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi

  build-windows:
    name: Build Windows (x64)
    needs: [build-frontend, release-meta]
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pyinstaller python-dotenv "cloakbrowser[geoip]==0.5.10"

      - name: 取回前端产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/web/dist

      - name: 下载自带隐身浏览器（Windows x64）
        shell: pwsh
        run: |
          $url = "https://github.com/CloakHQ/CloakBrowser/releases/download/chromium-v$env:CLOAK_CHROMIUM_VERSION/cloakbrowser-windows-x64.zip"
          Write-Host "下载 $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cb.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\cb.zip" -DestinationPath "$env:RUNNER_TEMP\cb" -Force
          # 压缩包内可能多套一层目录，直接按 chrome.exe 反查真实目录，别写死层级
          $exe = Get-ChildItem -Path "$env:RUNNER_TEMP\cb" -Recurse -Filter chrome.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "压缩包里没找到 chrome.exe，请检查上游 asset 布局" }
          $dst = "app\cloakbrowser-windows-x64"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path (Join-Path $exe.DirectoryName '*') -Destination $dst -Recurse -Force
          Write-Host "浏览器就位：$dst（chrome.exe $([math]::Round((Get-Item $exe.FullName).Length/1MB,1)) MB）"

      - name: 下载 gost（配套代理客户端）
        shell: pwsh
        run: |
          $url = "https://github.com/go-gost/gost/releases/download/v$env:GOST_VERSION/gost_$($env:GOST_VERSION)_windows_amd64.zip"
          Write-Host "下载 $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\gost.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\gost.zip" -DestinationPath "$env:RUNNER_TEMP\gost" -Force
          $exe = Get-ChildItem -Path "$env:RUNNER_TEMP\gost" -Recurse -Filter gost.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "压缩包里没找到 gost.exe" }
          $dst = "app\gost"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path $exe.FullName -Destination $dst -Force
          Write-Host "gost.exe 就位：$dst"

      - name: PyInstaller 打包
        shell: pwsh
        run: |
          # 入口在仓库根（main.py）：从那里打包，PyInstaller 的搜索路径天然
          # 就是仓库根，于是 app 包、以及它 import 的 core/douyin_im（连带
          # utils/*）都会被静态分析到，不需要 --paths 或逐个 --hidden-import。
          #
          # --windowed 打包的 exe 双击时没有命令行参数，main.py 靠 sys.frozen
          # 把默认模式设成 app、打开 GUI（源码/Docker 里默认仍是 task）。
          #
          # --collect-all playwright：cloakbrowser 底层用 playwright.sync_api，而它的
          #   driver 目录（含 node 运行时）必须一起带上，否则打包后启动浏览器会失败。
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "$env:APP_NAME" `
            --icon "app\logo.ico" `
            --hidden-import cloakbrowser `
            --hidden-import geoip2 `
            --hidden-import geoip2.database `
            --hidden-import maxminddb `
            --hidden-import socksio `
            --collect-all cloakbrowser `
            --collect-all playwright `
            --collect-all dotenv `
            --add-data "app\web\dist;app\web\dist" `
            "main.py"

      - name: 把两个分发物放到 exe 同级
        shell: pwsh
        run: |
          $dist = "dist\$env:APP_NAME"
          if (-not (Test-Path $dist)) { throw "没找到 PyInstaller 产物 $dist" }
          Copy-Item -Path "app\cloakbrowser-windows-x64" -Destination $dist -Recurse -Force
          Copy-Item -Path "app\gost" -Destination $dist -Recurse -Force
          Write-Host "发布目录顶层内容："
          Get-ChildItem $dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: 压缩成发布包
        shell: pwsh
        run: |
          $zip = "$env:APP_NAME-win-x64.zip"
          Compress-Archive -Path "dist\$env:APP_NAME" -DestinationPath $zip -Force
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "发布包：$zip（$size MB）"

      - name: 上传到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-meta.outputs.tag }}" "DouyinSparkFlow-win-x64.zip" --clobber

  build-linux-deb:
    name: Build Linux deb (${{ matrix.arch }})
    # 与 Windows job 并行；Release 已由 release-meta 建好，这里只传文件
    needs: [build-frontend, release-meta]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64：免费最新版只有 linux-x64（.5）
          - arch: amd64
            runner: ubuntu-latest
            cloak_tag: chromium-v146.0.7680.177.5
            cloak_asset: cloakbrowser-linux-x64.tar.gz
            cloak_dir: cloakbrowser-linux-x64
            gost_asset: gost_3.3.0_linux_amd64.tar.gz
          # arm64：只有 .3 同时提供 linux-x64 + linux-arm64（与 wrapper 映射一致）
          - arch: arm64
            runner: ubuntu-24.04-arm
            cloak_tag: chromium-v146.0.7680.177.3
            cloak_asset: cloakbrowser-linux-arm64.tar.gz
            cloak_dir: cloakbrowser-linux-arm64
            gost_asset: gost_3.3.0_linux_arm64.tar.gz

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pyinstaller
          pip install --no-cache-dir -r requirements.txt

      - name: 取回前端产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/web/dist

      - name: 下载自带隐身浏览器（${{ matrix.arch }}）
        env:
          CLOAK_TAG: ${{ matrix.cloak_tag }}
          CLOAK_ASSET: ${{ matrix.cloak_asset }}
        run: |
          set -euo pipefail
          base="https://github.com/CloakHQ/CloakBrowser/releases/download/${CLOAK_TAG}"
          curl -fL --connect-timeout 15 --max-time 900 --retry 2 --retry-delay 3 \
            -o "/tmp/${CLOAK_ASSET}" "${base}/${CLOAK_ASSET}"
          curl -fL --connect-timeout 15 --max-time 120 \
            -o /tmp/SHA256SUMS "${base}/SHA256SUMS"
          (cd /tmp && grep " ${CLOAK_ASSET}\$" SHA256SUMS | sha256sum -c -)

          rm -rf /tmp/cb_extract_tmp
          mkdir -p /tmp/cb_extract_tmp "app/${{ matrix.cloak_dir }}"
          tar -xzf "/tmp/${CLOAK_ASSET}" -C /tmp/cb_extract_tmp
          chrome="$(find /tmp/cb_extract_tmp -maxdepth 6 -type f -name chrome -perm -u+x | head -n 1)"
          test -n "${chrome}" || { echo "发布包里没找到 chrome 二进制" >&2; exit 1; }
          # 必须整目录拷贝：icudtl.dat / *.pak / locales 缺一个都启动不了
          cp -a "$(dirname "${chrome}")/." "app/${{ matrix.cloak_dir }}/"
          chmod +x "app/${{ matrix.cloak_dir }}/chrome"
          test -f "app/${{ matrix.cloak_dir }}/icudtl.dat"
          "app/${{ matrix.cloak_dir }}/chrome" --version

      - name: 下载 gost（${{ matrix.arch }}）
        env:
          GOST_ASSET: ${{ matrix.gost_asset }}
        run: |
          set -euo pipefail
          url="https://github.com/go-gost/gost/releases/download/v${GOST_VERSION}/${GOST_ASSET}"
          curl -fL --connect-timeout 15 --max-time 300 --retry 2 --retry-delay 3 -o /tmp/gost.tar.gz "$url"
          rm -rf /tmp/gost_extract
          mkdir -p /tmp/gost_extract
          tar -xzf /tmp/gost.tar.gz -C /tmp/gost_extract
          gost="$(find /tmp/gost_extract -maxdepth 3 -type f -name gost | head -n 1)"
          test -n "${gost}" || { echo "压缩包里没找到 gost" >&2; exit 1; }
          mkdir -p app/gost
          install -m 0755 "$gost" app/gost/gost

      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm --clean --onedir \
            --name "$APP_NAME" \
            --hidden-import cloakbrowser \
            --hidden-import geoip2 \
            --hidden-import geoip2.database \
            --hidden-import maxminddb \
            --hidden-import socksio \
            --collect-all cloakbrowser \
            --collect-all playwright \
            --collect-all dotenv \
            --add-data "app/web/dist:app/web/dist" \
            "main.py"

      - name: 打包成 deb
        id: deb
        run: |
          set -euo pipefail
          chmod +x tools/packaging/linux/build-deb.sh
          ver="$(cat VERSION)"
          out="${APP_NAME}_${ver}_${{ matrix.arch }}.deb"
          tools/packaging/linux/build-deb.sh \
            "${{ matrix.arch }}" \
            "${ver}" \
            "dist/${APP_NAME}" \
            "app/${{ matrix.cloak_dir }}" \
            "app/gost/gost" \
            "app/logo.png" \
            "${out}"
          # 布局自检：数据必须平铺在 /usr、/opt 下，不能再多套一层包名（否则装到 /douyin-spark-flow/usr/...）
          # 先把清单整份读进变量再判断 —— 用 `dpkg-deb -c | grep -q` 时 grep 提前退出会让
          # dpkg-deb 收到 SIGPIPE，配合 set -o pipefail 会误报「布局错误」。
          listing="$(dpkg-deb -c "${out}")"
          for path in \
            './usr/share/applications/douyin-spark-flow.desktop' \
            './usr/bin/douyin-spark-flow' \
            './opt/douyin-spark-flow/DouyinSparkFlow' \
            './usr/share/icons/hicolor/256x256/apps/douyin-spark-flow.png'; do
            case "$listing" in
              *"$path"*) ;;
              *) echo "deb 布局错误：缺 $path" >&2; exit 1 ;;
            esac
          done
          echo "file=${out}" >> "$GITHUB_OUTPUT"

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-meta.outputs.tag }}" "${{ steps.deb.outputs.file }}" --clobber
