{% extends "base.html" %}{% block content %}<header class="page-head"><div><span class="eyebrow">RUN HISTORY</span><h1>执行记录</h1><p>错误信息经过脱敏，不显示 Cookie 或聊天内容。</p></div></header><section class="panel"><div class="table-wrap"><table><thead><tr><th>计划时间</th><th>好友</th><th>状态</th><th>阶段</th><th>说明</th></tr></thead><tbody>{% for run, task in runs %}<tr><td>{{ run.scheduled_for }}</td><td>{{ task.target_name }}</td><td><span class="pill {{ 'good' if run.status == 'success' else 'off' }}">{{ run.status }}</span></td><td>{{ run.stage }}</td><td>{{ run.error_summary or '—' }}</td></tr>{% else %}<tr><td colspan="5" class="empty-cell">暂无执行记录</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
